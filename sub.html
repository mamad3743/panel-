<!doctype html><html lang="fa" dir="rtl" data-theme="__THEME__"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>BATAMN · __NAME__</title>
<link rel="preload" href="/fonts/vazir.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<style>
.s-wrap{max-width:480px;padding:20px 16px 46px}
.s-top{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 18px}
.s-brand{display:flex;align-items:center;gap:10px;color:var(--ac)}
.s-brand svg{width:40px;height:20px}
.s-brand b{font-size:15px;letter-spacing:.42em;font-weight:700;color:#eef2f8}
.s-card{margin-top:14px}
.s-hero{text-align:center;padding:28px 18px 20px;margin-top:0}
.s-name{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em}
.s-ring{position:relative;width:176px;height:176px;margin:20px auto 22px}
.s-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.s-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.s-ring .tr{stroke:rgba(255,255,255,.07)}
.s-ring .pg{stroke:url(#rg);transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1)}
.s-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.s-ring b{font-family:var(--fm);font-size:27px;font-weight:600;color:#fff;direction:ltr}
.s-ring small{margin-top:4px;color:var(--mu);font-size:10px;letter-spacing:3px}
.s-stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.02)}
.s-stats>div{padding:13px 6px 12px;min-width:0}
.s-stats>div+div{border-inline-start:1px solid var(--line)}
.s-stats small{display:block;color:var(--mu);font-size:9.5px;letter-spacing:2px;margin-bottom:6px}
.s-stats b{display:block;font-family:var(--fm);font-size:14.5px;font-weight:600;color:#fff;direction:ltr;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-stats em{display:block;font-style:normal;color:var(--mu);font-size:10.5px;margin-top:3px;min-height:15px}
.s-card h3{margin-bottom:14px}
.s-lead{margin:0 0 14px;color:var(--mu);font-size:12.5px;line-height:1.9}
.s-apps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.s-apps a{display:block;text-align:center;text-decoration:none;padding:11px 8px}
.s-ghost{display:block;width:100%;margin-top:12px;padding:10px;border:0;background:transparent;color:var(--mu);font:inherit;font-size:12.5px;cursor:pointer;border-radius:10px}
.s-ghost:active{color:var(--tx)}
.s-qr{margin:14px auto 2px;width:200px;height:200px;padding:8px;background:#fff;border-radius:16px}
.s-qr svg{width:100%;height:100%;display:block}
.s-cfg{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line);cursor:pointer}
.s-cfg:first-of-type{border-top:0}
.s-cfg .g{flex:1;min-width:0}
.s-cfg b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-cfg small{display:block;margin-top:3px;color:var(--mu);font-family:var(--fm);font-size:10.5px;letter-spacing:1px;direction:ltr;text-align:right}
.s-cp{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;color:var(--ac3);flex:none}
.s-cfg:active .s-cp{border-color:var(--ac)}
.s-all{padding:7px 12px;font-size:12px}
.s-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.s-row:first-of-type{border-top:0}
.s-row .g{flex:1;min-width:0}
.s-row small{display:block;color:var(--mu);font-size:10.5px}
.s-row b{display:block;font-family:var(--fm);font-size:12.5px;direction:ltr;text-align:left;word-break:break-all;margin-top:2px;font-weight:500}
.s-contact{display:flex;gap:10px;flex-wrap:wrap}
.s-contact .tg{min-width:140px}
.s-dead{text-align:center;padding:30px 12px 8px}
.s-dead .ic{width:60px;height:60px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(var(--rgb),.1);border:1px solid var(--line);color:var(--ac)}
.s-dead .ic svg{width:28px;height:28px}
.s-dead h2{margin:0 0 6px;font-size:19px}
.s-dead p{margin:0;color:var(--mu);font-size:13px;line-height:1.9}
.hide{display:none!important}
</style></head><body><div class="bgimg"></div>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="bat" viewBox="0 0 200 100"><path d="M100 26L104 12L108 25L116 24C140 14 172 18 196 40C184 40 176 46 172 58C164 50 152 50 146 60C140 54 132 56 128 66C124 60 116 62 112 74L106 66L100 78L94 66L88 74C84 62 76 60 72 66C68 56 60 54 54 60C48 50 36 50 28 58C24 46 16 40 4 40C28 18 60 14 84 24L92 25L96 12L100 26Z"/></symbol>
<linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ac3)"/><stop offset="1" style="stop-color:var(--ac2)"/></linearGradient></defs></svg>

<div class="wrap s-wrap">
  <header class="s-top"><div class="s-brand"><svg class="emb" viewBox="0 0 200 100"><use href="#bat"/></svg><b>BATAMN</b></div><span class="pill" id="stp"><i></i><span></span></span></header>

  <section class="card s-hero">
    <h1 class="s-name">__NAME__</h1>
    <div id="live">
      <div class="s-ring"><svg viewBox="0 0 176 176"><circle class="tr" cx="88" cy="88" r="76"/><circle class="pg" id="rp" cx="88" cy="88" r="76" stroke-dasharray="0 478"/></svg><div class="c"><b id="rn">—</b><small id="rl">REMAINING</small></div></div>
      <div class="s-stats">
        <div><small>USED</small><b id="t1">—</b></div>
        <div><small>TOTAL</small><b id="t3">—</b></div>
        <div><small>EXPIRES</small><b id="t4">—</b><em id="t4d"></em></div>
      </div>
    </div>
    <div class="s-dead hide" id="dead"><div class="ic" id="deadIc"></div><h2 id="deadT"></h2><p id="deadP"></p></div>
  </section>

  <section class="card s-card" id="act">
    <h3><span>Subscription</span></h3>
    <p class="s-lead">لینک اشتراک رو توی اپ اضافه کن. با هر آپدیت، حجم و زمان باقی‌مانده تازه می‌شه.</p>
    <button class="btn" id="cs">کپی لینک اشتراک</button>
    <div class="s-apps" id="apps"></div>
    <button class="s-ghost" id="qrbtn">نمایش QR</button>
    <div class="s-qr hide" id="qrb">__QR__</div>
    <button class="s-ghost hide" id="altBtn">کپی لینک جایگزین (اگه دامنه اصلی باز نشد)</button>
  </section>

  <section class="card s-card" id="cc">
    <h3><span>Configs</span><button class="sm s-all" id="copyAll">کپی همه</button></h3>
    <div id="cfs"></div>
  </section>

  <section class="card s-card hide" id="payc"><h3><span>تمدید اشتراک</span></h3><div id="payl"></div></section>
  <section class="card s-card hide" id="sshc"><h3><span>SSH · WebSocket</span></h3><div id="sshl"></div><p class="s-lead" style="margin:10px 0 0">برای HTTP Injector، HTTP Custom و NapsternetV: حالت SSH با Payload، پورت 443 و TLS</p></section>
  <section class="card s-card hide" id="ctc"><div class="s-contact" id="ctr"></div></section>

  <div class="ft" id="ft">BATAMN</div>
</div>
<div id="toast"></div>
<script>
var D=__DATA__,$=function(i){return document.getElementById(i)};
var IC={copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>',pause:'<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',hourglass:'<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>',box:'<path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5v-9zM3 7.5L12 12l9-4.5M12 12v9"/>',tg:'<path fill="currentColor" stroke="none" d="M21.6 3.4L2.7 10.7c-.9.35-.9 1.6.05 1.9l4.6 1.5 1.8 5.6c.2.7 1.1.9 1.6.4l2.6-2.4 4.7 3.5c.6.4 1.4.1 1.6-.6L23.1 5c.2-.9-.7-1.8-1.5-1.6zM9.4 13.6l8.2-5.1-6.3 6.1-.3 3z"/>'};
function ico(n){return '<svg class="svgi" viewBox="0 0 24 24">'+(IC[n]||'')+'</svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.className='s';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},1500)}
function cp(t,m){var done=function(){toast(m||'کپی شد')};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(function(){fb(t);done()})}else{fb(t);done()}}
function fb(t){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}
function B(n){n=+n||0;if(n<1048576)return'0 MB';var u=['MB','GB','TB'],i=0;n/=1048576;while(n>=1024&&i<2){n/=1024;i++}return(n>=100?n.toFixed(0):n.toFixed(2).replace(/\.?0+$/,''))+' '+u[i]}
function jdate(ms){try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ms))}catch(e){return''}}
var C=D.contact||{},U=D.sub,E=encodeURIComponent(U),ok=D.status==='active';

/* status pill */
var ST={active:['فعال','ok'],off:['غیرفعال','bad'],expired:['منقضی','bad'],limited:['حجم تمام','bad']}[D.status]||['—',''];
$('stp').className='pill '+ST[1];$('stp').lastChild.textContent=ST[0];

if(ok){
  var pc=D.limit?Math.min(100,D.used/D.limit*100):0,days=D.exp?Math.max(0,Math.ceil((D.exp-Date.now())/864e5)):null;
  $('rn').textContent=D.limit?B(Math.max(0,D.limit-D.used)):'∞';$('rl').textContent=D.limit?'REMAINING':'UNLIMITED';
  $('t1').textContent=B(D.used);$('t3').textContent=D.limit?B(D.limit):'∞';
  $('t4').textContent=D.exp?days+' روز':'∞';$('t4d').textContent=D.exp?jdate(D.exp):'';
  setTimeout(function(){$('rp').style.strokeDasharray=(D.limit?pc/100*478:478)+' 478';if(!D.limit)$('rp').style.opacity='.3'},200);
}else{
  $('live').classList.add('hide');$('dead').classList.remove('hide');
  var M={off:['pause','اشتراک غیرفعاله','این اشتراک توسط مدیر غیرفعال شده. برای فعال‌سازی با پشتیبانی در تماس باش.'],expired:['hourglass','اشتراک منقضی شده','زمان اشتراک تموم شده. برای تمدید با پشتیبانی در تماس باش.'],limited:['box','حجم اشتراک تموم شده','حجم مصرفی به سقف رسیده. برای تمدید با پشتیبانی در تماس باش.']}[D.status]||['pause','اشتراک فعال نیست',''];
  $('deadIc').innerHTML=ico(M[0]);$('deadT').textContent=M[1];$('deadP').textContent=M[2];
  $('act').classList.add('hide');$('cc').classList.add('hide');
}

/* subscription actions */
$('cs').onclick=function(){cp(U,'لینک اشتراک کپی شد')};
$('apps').innerHTML=[['Hiddify','hiddify://import/'+U+'#BATAMN'],['v2rayNG','v2rayng://install-sub?url='+E+'&name=BATAMN'],['Streisand','streisand://import/'+U],['Shadowrocket','shadowrocket://add/sub://'+btoa(U)+'?remark=BATAMN']].map(function(a){return '<a class="sm" href="'+a[1]+'">'+a[0]+'</a>'}).join('');
$('qrbtn').onclick=function(){var q=$('qrb'),h=q.classList.toggle('hide');this.textContent=h?'نمایش QR':'پنهان کردن QR'};
if(!$('qrb').querySelector('svg')){$('qrbtn').classList.add('hide')}
if(D.altSub){var ab=$('altBtn');ab.classList.remove('hide');ab.onclick=function(){cp(D.altSub,'لینک جایگزین کپی شد')}}

/* configs: name shown in the app + a short protocol tag */
function proto(l){return l.l.split(':')[0].toUpperCase()}
function dispName(l){try{if(l.l.indexOf('vmess://')===0)return JSON.parse(decodeURIComponent(escape(atob(l.l.slice(8))))).ps||l.n;var i=l.l.indexOf('#');return i>=0?decodeURIComponent(l.l.slice(i+1)):l.n}catch(e){return l.n}}
var L=D.links||[];
$('cfs').innerHTML=L.map(function(l,i){return '<div class="s-cfg" data-i="'+i+'"><div class="g"><b dir="auto">'+esc(dispName(l))+'</b><small>'+esc(proto(l))+(l.n?' · '+esc(l.n.replace(/^[A-Za-z]+\s*·\s*/,'')):'')+'</small></div><div class="s-cp">'+ico('copy')+'</div></div>'}).join('');
$('cfs').onclick=function(e){var r=e.target.closest('.s-cfg');if(r)cp(L[+r.dataset.i].l,'کانفیگ کپی شد')};
$('copyAll').onclick=function(){cp(L.map(function(l){return l.l}).join('\n'),L.length+' کانفیگ کپی شد')};
if(!L.length)$('cc').classList.add('hide');

/* payment (only when configured) */
var P=D.pay||{};
if(P.card||P.url){var ph='';
  if(P.card)ph+='<div class="s-row"><div class="g"><small>شماره کارت</small><b>'+esc(P.card)+'</b></div><button class="sm p" id="payCp">کپی</button></div>';
  if(P.url)ph+='<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="'+esc(P.url)+'" target="_blank" rel="noopener">پرداخت آنلاین</a>';
  $('payl').innerHTML=ph;$('payc').classList.remove('hide');
  if($('payCp'))$('payCp').onclick=function(){cp(P.card.replace(/\s/g,''),'شماره کارت کپی شد')}}

/* SSH (only when enabled for this user) */
if(D.ssh&&ok){var s=D.ssh,pl='GET /ssh HTTP/1.1[crlf]Host: '+s.sni+'[crlf]Upgrade: websocket[crlf][crlf]',lk='ssh://'+encodeURIComponent(s.user)+':'+encodeURIComponent(s.pass)+'@'+s.host+':'+s.port+'#BATAMN',
  rows=[['Host',s.host],['Port',String(s.port)],['Username',s.user],['Password',s.pass],['SNI / Host',s.sni],['Payload',pl],['Link',lk]];
  $('sshl').innerHTML=rows.map(function(r,i){return '<div class="s-row"><div class="g"><small>'+r[0]+'</small><b>'+esc(r[1])+'</b></div><button class="s-cp" data-i="'+i+'">'+ico('copy')+'</button></div>'}).join('');
  $('sshl').onclick=function(e){var b=e.target.closest('button');if(b)cp(rows[+b.dataset.i][1])};$('sshc').classList.remove('hide')}

/* contact */
var cx='';
if(C.support)cx+='<a class="tg" href="https://t.me/'+esc(C.support)+'" target="_blank" rel="noopener">'+ico('tg')+'<span><b>پشتیبانی</b><small>@'+esc(C.support)+'</small></span></a>';
if(C.channel)cx+='<a class="tg" href="https://t.me/'+esc(C.channel)+'" target="_blank" rel="noopener">'+ico('tg')+'<span><b>کانال</b><small>@'+esc(C.channel)+'</small></span></a>';
if(D.bot)cx+='<a class="tg" href="https://t.me/'+esc(D.bot)+'" target="_blank" rel="noopener">'+ico('tg')+'<span><b>ربات</b><small>@'+esc(D.bot)+'</small></span></a>';
if(cx){$('ctr').innerHTML=cx;$('ctc').classList.remove('hide')}
$('ft').innerHTML='BATAMN'+(C.support?'<br><a href="https://t.me/'+esc(C.support)+'" target="_blank" rel="noopener">@'+esc(C.support)+'</a>':'')+(C.channel?' &nbsp;·&nbsp; <a href="https://t.me/'+esc(C.channel)+'" target="_blank" rel="noopener">@'+esc(C.channel)+'</a>':'');
</script></body></html>
