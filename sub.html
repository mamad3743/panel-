<style>
/* ===== BATAMN subscription page ===== */
.x-wrap{max-width:980px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.x-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:2px}
.x-brand{display:flex;align-items:center;gap:11px;color:var(--ac)}
.x-brand svg{width:46px;height:23px;filter:drop-shadow(0 0 12px rgba(var(--rgb),.55))}
.x-brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.38em;padding-inline-start:.38em;background:linear-gradient(180deg,#fff,rgba(var(--rgb),.92));-webkit-background-clip:text;background-clip:text;color:transparent}
.x-meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.x-user{unicode-bidi:plaintext;font-weight:600;color:var(--tx)}
.x-onl{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.x-onl i{width:7px;height:7px;border-radius:50%;background:currentColor}
.x-onl.up{color:var(--ok)}.x-onl.up i{box-shadow:0 0 8px currentColor;animation:xp 1.8s infinite}
@keyframes xp{50%{opacity:.35}}
.x-ib{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mu);display:grid;place-items:center;cursor:pointer;transition:.2s;padding:0}
.x-ib:hover{color:var(--tx);border-color:rgba(var(--rgb),.4)}
.x-ib.spin svg{animation:xs .9s linear infinite}
@keyframes xs{to{transform:rotate(360deg)}}
/* notes */
.x-note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:13px;font-size:13px;line-height:1.9;border:1px solid}
.x-note svg{flex:none;margin-top:4px}
.x-note.warn{background:rgba(232,179,74,.1);border-color:rgba(232,179,74,.34);color:var(--warn)}
.x-note.bad{background:rgba(239,107,127,.1);border-color:rgba(239,107,127,.34);color:var(--bad)}
.x-note.info{background:rgba(var(--rgb),.1);border-color:rgba(var(--rgb),.3);color:var(--tx);white-space:pre-line}
/* top: status + side */
.x-top{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.x-st{--sc:var(--ok);overflow:hidden;padding:20px}
.x-st.warn{--sc:var(--warn)}.x-st.bad{--sc:var(--bad)}
.x-st:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0,var(--sc),transparent 62%);opacity:.11;pointer-events:none}
.x-st>*{position:relative;z-index:1}
.x-sth{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x-stt{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;color:var(--sc);line-height:1.3;text-shadow:0 0 26px currentColor}
.x-stt i{width:9px;height:9px;border-radius:50%;background:currentColor;animation:xr 2s infinite;flex:none}
@keyframes xr{0%{box-shadow:0 0 0 0 currentColor}70%,100%{box-shadow:0 0 0 9px transparent}}
.x-lab{font-size:11.5px;color:var(--mu)}
.x-ein{text-align:end}.x-ein b{display:block;font-family:var(--fm);font-size:20px;font-weight:700;direction:ltr;line-height:1.3}
.x-stb{display:flex;align-items:center;gap:22px;margin-top:22px}
.x-ring{position:relative;width:112px;height:112px;flex:none;color:var(--sc)}
.x-ring .rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.x-ring .tk{stroke:currentColor;opacity:.16}
.x-ring .br{stroke:currentColor;stroke-linecap:round;stroke-dasharray:251.33;stroke-dashoffset:251.33;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px currentColor)}
.x-ring .orb{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);animation:xo 24s linear infinite;opacity:.55}
@keyframes xo{to{transform:rotate(360deg)}}
.x-ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--tx)}
.x-ring .mid b{display:block;font-family:var(--fm);font-size:21px;font-weight:700;line-height:1;direction:ltr}
.x-ring .mid small{display:block;font-size:10.5px;color:var(--mu);margin-top:5px}
.x-rows{flex:1;min-width:0;max-width:400px;display:grid;gap:11px}
.x-rw{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.x-rw b{font-family:var(--fm);color:var(--tx);font-weight:600;white-space:nowrap;direction:ltr}
.x-rw.g b{color:var(--sc)}
.x-bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.x-bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--sc);transition:width 1.4s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--sc)}
.x-side{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.x-side>:last-child{grid-column:1/-1}
.x-sc{padding:15px 16px}
.x-sc .x-lab{margin-bottom:8px}
.x-v{display:block;font-size:18px;font-weight:800;line-height:1.4}
.x-v.m{font-family:var(--fm);direction:ltr;text-align:start}
.x-v small{font-size:12px;color:var(--mu);font-weight:600;margin-inline-start:3px}
.x-cd{display:block;margin-top:3px;font-family:var(--fm);font-size:11.5px;color:var(--mu);direction:ltr;text-align:start}
.x-spark{width:100%;height:26px;margin-top:8px;direction:ltr}
.x-spark polyline{fill:none;stroke:var(--ac);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.x-q{font-size:11.5px;font-weight:700}.x-q.g{color:var(--ok)}.x-q.y{color:var(--warn)}.x-q.r{color:var(--bad)}
/* main */
.x-main{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"sub" "apps" "cfg" "extra" "help" "tg"}
.a-sub{grid-area:sub}.a-apps{grid-area:apps}.a-cfg{grid-area:cfg}.a-ex{grid-area:extra;display:grid;gap:14px}.a-help{grid-area:help}.a-tg{grid-area:tg}
.x-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin:0 0 14px}
.x-h>svg{color:var(--ac);flex:none}
.x-h .sp{flex:1}
.x-h small{font-size:11.5px;color:var(--mu);font-weight:600;font-family:var(--fm)}
.xb{border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border-radius:11px;font:inherit;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--ac1),var(--ac2));box-shadow:0 8px 22px -8px rgba(var(--rgb2),.7);transition:filter .2s,transform .15s;text-decoration:none;touch-action:manipulation}
.xb:active{transform:scale(.97)}.xb:hover{filter:brightness(1.1)}
.xb.gh{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--tx);box-shadow:none}
.xb.gh:hover{border-color:rgba(var(--rgb),.45);filter:none}
.xb.wide{display:flex;width:100%;padding:12px 14px}
.x-lk{display:flex;align-items:center;gap:8px;padding:5px;border-radius:12px;background:rgba(0,0,0,.32);border:1px solid var(--line);direction:ltr}
.x-lk code{flex:1;min-width:0;padding-left:10px;font:12px var(--fm);color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.x-qrw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.x-qrw.on{grid-template-rows:1fr}
.x-qrw>div{overflow:hidden;min-height:0}
.x-qr{margin:14px auto 2px;width:216px;max-width:100%;padding:10px;border-radius:14px;background:#fff}
.x-qr svg{width:100%;height:auto;display:block}
.x-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:6px}
.x-app{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 11px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:12.5px;font-weight:600;text-decoration:none;color:var(--tx);transition:.2s;touch-action:manipulation}
.x-app:hover{border-color:rgba(var(--rgb),.45);background:rgba(var(--rgb),.07)}
.x-app .ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 14px var(--fm);background:linear-gradient(135deg,rgba(var(--rgb),.5),rgba(var(--rgb2),.28));border:1px solid rgba(var(--rgb),.35)}
.x-app.rec{border-color:var(--ac)}
.x-app .tag{position:absolute;top:-9px;font-size:10px;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--ac1);color:#fff;white-space:nowrap}
.x-cf{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:8px}
.x-cf:last-child{margin-bottom:0}
.x-cf.info{opacity:.85;border-style:dashed}
.x-bdg{flex:none;font:800 10px var(--fm);letter-spacing:.3px;padding:4px 8px;border-radius:7px;background:rgba(var(--rgb),.16);color:var(--ac3);border:1px solid rgba(var(--rgb),.3);direction:ltr}
.x-nm{flex:1;min-width:0}
.x-nm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:start}
.x-nm small{display:block;font:11px var(--fm);color:var(--mu);margin-top:3px;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-cp{width:34px;height:34px;flex:none;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mu);cursor:pointer;display:grid;place-items:center;transition:.2s;padding:0;touch-action:manipulation}
.x-cp:hover{color:var(--tx);border-color:rgba(var(--rgb),.4)}
.x-cp.ok{background:rgba(79,209,160,.14);color:var(--ok);border-color:rgba(79,209,160,.4)}
.x-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.x-row:first-of-type{border-top:0}
.x-row .g{flex:1;min-width:0}
.x-row small{display:block;color:var(--mu);font-size:10.5px}
.x-row b{display:block;font:500 12.5px var(--fm);direction:ltr;text-align:left;word-break:break-all;margin-top:2px}
.x-empty{text-align:center;color:var(--mu);font-size:13px;line-height:1.9;padding:14px 6px}
/* help */
.x-det{border-top:1px solid var(--line);padding:12px 2px}
.x-det:first-of-type{border-top:0;padding-top:0}
.x-det summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px}
.x-det summary::-webkit-details-marker{display:none}
.x-det .n{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;font:700 11px var(--fm);background:rgba(var(--rgb),.12);border:1px solid rgba(var(--rgb),.3);color:var(--ac3)}
.x-det .ar{margin-inline-start:auto;flex:none;color:var(--mu);transition:transform .25s}
.x-det[open] .ar{transform:rotate(180deg)}
.x-dc{font-size:13px;line-height:2;color:var(--mu);padding-top:7px;padding-inline-start:32px}
/* contact */
.x-tgw{display:grid;gap:12px}
.x-tgc{display:flex;align-items:center;gap:12px;padding:13px 16px;text-decoration:none;color:var(--tx);transition:.2s}
.x-tgc:hover{background:rgba(var(--rgb),.06)}
.x-tgc .ti{width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(135deg,#2aabee,#1c7fc4);display:grid;place-items:center;color:#fff}
.x-tgc b{display:block;font-size:14px;font-weight:700}
.x-tgc small{font:12px var(--fm);color:var(--mu);direction:ltr;display:block;text-align:start}
.x-tgc .go{margin-inline-start:auto;flex:none;color:var(--mu)}
html,body{overflow-x:hidden}
html[dir=rtl] .x-tgc .go{transform:scaleX(-1)}
.x-foot{text-align:center;font-size:11.5px;color:var(--mu);padding:10px 0 0;direction:ltr;letter-spacing:.5px}
.x-foot b{color:var(--tx);letter-spacing:.3em}
.x-foot a{color:var(--mu);text-decoration:none}
/* sheet + toast */
.x-ov{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,8,.7);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.x-ov.on{opacity:1;visibility:visible}
.x-sheet{width:100%;max-width:440px;margin:0 10px max(10px,env(safe-area-inset-bottom));border-radius:20px;padding:18px;text-align:center;transform:translate3d(0,30px,0);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.x-ov.on .x-sheet{transform:none}
.x-sheet h3{margin:0 0 12px;font-size:14px;unicode-bidi:plaintext;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.x-sheet .x-qr{width:240px;margin:0 auto 14px}
.x-toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));z-index:60;transform:translate3d(-50%,-170%,0);display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:13px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);font-size:13px;font-weight:600;box-shadow:0 14px 34px -10px rgba(0,0,0,.6);transition:transform .4s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:90vw}
.x-toast.on{transform:translate3d(-50%,0,0)}
.x-toast .o{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(79,209,160,.16);color:var(--ok)}
.x-toast.err .o{background:rgba(239,107,127,.16);color:var(--bad)}
.hide{display:none!important}
@media(min-width:760px){
 .x-wrap{padding-top:34px;gap:16px}
 .x-main{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"cfg sub" "cfg apps" "cfg extra" "cfg help" "cfg tg";grid-template-rows:auto auto auto auto 1fr;align-items:start}
}
@media(min-width:560px){.x-side{grid-template-columns:repeat(3,minmax(0,1fr))}.x-side>:last-child{grid-column:auto}}
@media(max-width:380px){.x-apps{grid-template-columns:repeat(2,1fr)}.x-stb{gap:14px}.x-ring{width:96px;height:96px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
